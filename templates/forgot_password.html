<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - MedReach Field Portal</title>
  <link rel="icon" href="/static/images/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --primary: #149B9E;
      --primary-dark: #0E7F82;
      --primary-light: #E6F7F5;
      --surface: #FFFFFF;
      --surface-border: #E2E8F0;
      --text-dark: #0F172A;
      --text-secondary: #64748B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    html, body { width: 100%; min-height: 100%; background: #F8FAFC; color: var(--text-dark); display: flex; flex-direction: column; }

    .portal-navbar {
      width: 100%;
      height: 68px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--surface-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
    }
    .brand-link { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; font-size: 18px; font-weight: 800; }
    .brand-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 22px; }

    .center-canvas {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .form-card {
      width: 100%;
      max-width: 480px;
      background: #FFFFFF;
      border-radius: 24px;
      border: 1px solid var(--surface-border);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
      padding: 40px 36px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-card h2 { font-size: 24px; font-weight: 800; color: var(--text-dark); }
    .form-card p { font-size: 14px; color: var(--text-secondary); line-height: 1.5; }

    .input-box {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1.5px solid var(--surface-border);
      border-radius: 14px;
      padding: 14px 16px;
      background: #FFFFFF;
      transition: border-color 0.15s;
    }
    .input-box:focus-within { border-color: var(--primary); }
    .input-box input { border: none; background: transparent; outline: none; flex: 1; font-size: 15px; color: var(--text-dark); }

    .btn-submit {
      width: 100%;
      height: 50px;
      border-radius: 25px;
      background: var(--primary);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(20, 155, 158, 0.25);
    }
    .btn-submit:hover { background: var(--primary-dark); }

    .back-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      text-decoration: none;
      margin-top: 8px;
    }
    .back-link:hover { color: var(--primary); }
  </style>
</head>
<body>

  <header class="portal-navbar">
    <a href="/login" class="brand-link">
      <div class="brand-icon">+</div>
      <span>MedReach Diagnostics Field Suite</span>
    </a>
  </header>

  <main class="center-canvas">
    <div class="form-card">
      <div>
        <h2>Reset Password</h2>
        <p>Enter your registered mobile number or email ID to receive an OTP verification code.</p>
      </div>

      <div>
        <label style="display: block; font-size: 13.5px; font-weight: 700; color: var(--text-dark); margin-bottom: 8px;">Registered Mobile or Email</label>
        <div class="input-box">
          <span style="color: var(--primary); font-size: 18px;">📞</span>
          <input type="text" id="resetContact" placeholder="e.g. 9342600642 or your.email@domain.com">
        </div>
      </div>

      <a href="/verify-otp" class="btn-submit" onclick="sessionStorage.setItem('reset_contact', document.getElementById('resetContact').value || '9342600642')">
        Send OTP Code ➔
      </a>

      <a href="/login" class="back-link">
        ← Back to Login
      </a>
    </div>
  </main>

</body>
</html>
