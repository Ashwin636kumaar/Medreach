<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Forgot Password - MedReach</title>
  <link rel="icon" href="/static/images/favicon.svg" type="image/svg+xml">
  <style>
    :root { --primary: #149B9E; --surface: #FFFFFF; --surface-border: #E2E8F0; --text-dark: #0F172A; --text-secondary: #64748B; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    html, body { width: 100%; height: 100%; background: #0B192C; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    .phone-canvas { width: 100%; max-width: 412px; height: 100%; max-height: 860px; background: var(--surface); border-radius: 36px; box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    @media (max-width: 480px) { .phone-canvas { max-width: 100%; max-height: 100%; border-radius: 0; box-shadow: none; } }
    .phone-status-bar { height: 38px; padding: 8px 20px 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--text-dark); flex-shrink: 0; }
    .subscreen-header { height: 54px; padding: 0 16px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--surface-border); flex-shrink: 0; }
    .back-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: transparent; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text-dark); text-decoration: none; }
    .btn-send-otp { width: 100%; height: 50px; border-radius: 25px; background: var(--primary); color: #FFFFFF; font-size: 15.5px; font-weight: 700; border: none; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="phone-canvas">
    <div class="phone-status-bar">
      <span>09:41</span>
      <div style="display: flex; gap: 6px; font-size: 11px;"><span>5G</span><span>📶</span><span>🔋 100%</span></div>
    </div>
    <div class="subscreen-header">
      <a href="/" class="back-btn">←</a>
      <div style="font-size: 17px; font-weight: 800; color: var(--text-dark);">Forgot Password</div>
    </div>
    <div style="padding: 24px 20px; flex: 1;">
      <div style="font-size: 13.5px; color: var(--text-secondary); margin-bottom: 20px;">
        Enter your registered mobile number or email ID to receive a verification OTP code.
      </div>
      <label style="display: block; font-size: 13px; font-weight: 600; color: var(--text-dark); margin-bottom: 6px;">Registered Mobile / Email</label>
      <div style="display: flex; align-items: center; background: var(--surface); border: 1.5px solid var(--surface-border); border-radius: 14px; padding: 12px 14px; gap: 10px;">
        <span style="color: var(--primary);">📞</span>
        <input type="text" value="+91 98765 43210" style="border: none; background: transparent; outline: none; flex: 1; font-size: 14px;">
      </div>
      <a href="/verify-otp" class="btn-send-otp">Send OTP</a>
    </div>
  </div>
</body>
</html>
