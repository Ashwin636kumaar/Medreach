<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Verify OTP - MedReach</title>
  <link rel="icon" href="/static/images/favicon.svg" type="image/svg+xml">
  <style>
    :root { --primary: #149B9E; --surface: #FFFFFF; --surface-border: #E2E8F0; --text-dark: #0F172A; --text-secondary: #64748B; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    html, body { width: 100%; height: 100%; background: #0B192C; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    .phone-canvas { width: 100%; max-width: 412px; height: 100%; max-height: 860px; background: var(--surface); border-radius: 36px; box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    @media (max-width: 480px) { .phone-canvas { max-width: 100%; max-height: 100%; border-radius: 0; box-shadow: none; } }
    .phone-status-bar { height: 38px; padding: 8px 20px 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--text-dark); flex-shrink: 0; }
    .subscreen-header { height: 54px; padding: 0 16px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--surface-border); flex-shrink: 0; }
    .back-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: transparent; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text-dark); text-decoration: none; }
    .btn-verify { width: 100%; height: 50px; border-radius: 25px; background: var(--primary); color: #FFFFFF; font-size: 15.5px; font-weight: 700; border: none; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div class="phone-canvas">
    <div class="phone-status-bar">
      <span>09:41</span>
      <div style="display: flex; gap: 6px; font-size: 11px;"><span>5G</span><span>📶</span><span>🔋 100%</span></div>
    </div>
    <div class="subscreen-header">
      <a href="/forgot-password" class="back-btn">←</a>
      <div style="font-size: 17px; font-weight: 800; color: var(--text-dark);">Verify OTP</div>
    </div>
    <div style="padding: 24px 20px; flex: 1; text-align: center;">
      <div style="font-size: 13.5px; color: var(--text-secondary); margin-bottom: 24px;">
        Enter the 4-digit verification code sent to +91 98765 43210
      </div>

      <div style="display: flex; justify-content: center; gap: 12px; margin-bottom: 24px;">
        <input type="text" maxlength="1" value="8" style="width: 48px; height: 52px; border-radius: 12px; border: 1.5px solid var(--primary); text-align: center; font-size: 20px; font-weight: 800;">
        <input type="text" maxlength="1" value="8" style="width: 48px; height: 52px; border-radius: 12px; border: 1.5px solid var(--primary); text-align: center; font-size: 20px; font-weight: 800;">
        <input type="text" maxlength="1" value="4" style="width: 48px; height: 52px; border-radius: 12px; border: 1.5px solid var(--primary); text-align: center; font-size: 20px; font-weight: 800;">
        <input type="text" maxlength="1" value="2" style="width: 48px; height: 52px; border-radius: 12px; border: 1.5px solid var(--primary); text-align: center; font-size: 20px; font-weight: 800;">
      </div>

      <a href="/" class="btn-verify" onclick="alert('OTP Verified! Session authenticated.');">Verify & Continue</a>
    </div>
  </div>
</body>
</html>
