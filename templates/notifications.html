<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - MedReach Diagnostics Field Portal</title>
  <link rel="icon" href="/static/images/favicon.svg" type="image/svg+xml">
  <style>
    :root { --primary:#149B9E; --primary-dark:#0E7F82; --primary-light:#E6F7F5; --border:#E2E8F0; --text-dark:#0F172A; --text-secondary:#64748B; --gold:#FDE047; --red:#EF4444; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    html,body { width:100%; min-height:100%; background:#F8FAFC; color:var(--text-dark); }
    body { display:flex; flex-direction:column; }

    .portal-navbar { height:68px; background:#fff; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 40px; position:sticky; top:0; z-index:1000; box-shadow:0 2px 10px rgba(0,0,0,.03); }
    .brand { display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit; }
    .brand-icon { width:42px; height:42px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800; }
    .brand h1 { font-size:20px; font-weight:800; letter-spacing:-.5px; line-height:1.1; }
    .brand span { font-size:11px; font-weight:600; color:var(--primary); text-transform:uppercase; letter-spacing:.8px; }
    .nav-right { display:flex; align-items:center; gap:16px; }
    .bell { width:42px; height:42px; border-radius:50%; background:#E2E8F0; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:18px; text-decoration:none; position:relative; }
    .bell i { position:absolute; top:9px; right:10px; width:8px; height:8px; border-radius:50%; background:var(--red); }
    .user { display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; padding:6px 14px 6px 6px; border-radius:30px; background:#F1F5F9; }
    .user:hover { background:#E2E8F0; }
    .avatar-sm { width:36px; height:36px; border-radius:50%; background:var(--gold); color:#854D0E; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; }

    .page { width:100%; max-width:1100px; margin:0 auto; padding:30px 40px 50px; display:flex; flex-direction:column; gap:24px; }
    .page-head { display:flex; align-items:center; gap:14px; }
    .back-btn { width:42px; height:42px; border-radius:50%; background:#fff; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--text-dark); text-decoration:none; }
    .back-btn:hover { background:#F1F5F9; }
    .page-head h2 { font-size:26px; font-weight:800; letter-spacing:-.4px; }
    .crumbs { font-size:13px; color:var(--text-secondary); margin-top:2px; }
    .head-spacer { flex:1; }
    .btn-mark { padding:10px 20px; border-radius:22px; background:#fff; border:1.5px solid var(--primary); color:var(--primary); font-size:13.5px; font-weight:700; cursor:pointer; }
    .btn-mark:hover { background:var(--primary-light); }

    .layout { display:grid; grid-template-columns:1fr 2fr; gap:26px; align-items:start; }
    @media (max-width:860px) { .layout { grid-template-columns:1fr; } .portal-navbar { padding:0 16px; } .page { padding:20px 16px 40px; } }
  
    .temp-card { background:#E0F2FE; border:1px solid #BAE6FD; border-radius:24px; padding:28px; color:#0369A1; }
    .temp-top { display:flex; align-items:center; gap:10px; font-size:15px; font-weight:800; }
    .temp-val { font-size:52px; font-weight:800; letter-spacing:-1px; margin:14px 0 6px; }
    .temp-note { font-size:13.5px; font-weight:600; color:#0C4A6E; }

    .list { display:flex; flex-direction:column; gap:14px; }
    .note-card { background:#fff; border:1px solid var(--border); border-radius:20px; padding:20px 24px; box-shadow:0 4px 16px rgba(0,0,0,.03); display:flex; align-items:flex-start; gap:16px; transition:transform .15s, box-shadow .15s; }
    .note-card:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.06); }
    .note-ico { width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:21px; flex-shrink:0; background:var(--primary-light); }
    .note-ico.temp { background:#E0F2FE; }
    .note-body { flex:1; min-width:0; }
    .note-title { font-size:17px; font-weight:800; }
    .note-text { font-size:14px; color:var(--text-secondary); margin-top:4px; }
    .note-time { font-size:12.5px; font-weight:700; color:var(--text-secondary); margin-top:8px; }
    .note-time.new { color:var(--primary); }
    .dot-new { width:10px; height:10px; border-radius:50%; background:var(--red); flex-shrink:0; margin-top:6px; }
    .note-card.read .dot-new { display:none; }
    .empty { text-align:center; color:#94A3B8; padding:40px 16px; background:#fff; border:1px dashed var(--border); border-radius:20px; font-size:14px; }
  </style>
</head>
<body>

  <header class="portal-navbar">
    <a href="/home" class="brand">
      <div class="brand-icon">+</div>
      <div><h1>MedReach</h1><span>Diagnostics Field Suite</span></div>
    </a>
    <div class="nav-right">
      <a href="/notifications" class="bell"><span>🔔</span><i id="bellDot"></i></a>
      <a href="/profile" class="user">
        <div class="avatar-sm" id="navAvatar">AK</div>
        <div>
          <div style="font-size:13px;font-weight:800;" id="navUserName">Ashwin Kumar</div>
          <div style="font-size:11px;color:var(--text-secondary);" id="navUserRole">EMP-9342 • Field Lead</div>
        </div>
      </a>
    </div>
  </header>

  <main class="page">
    <div class="page-head">
      <a href="/home" class="back-btn" aria-label="Back to dashboard">←</a>
      <div>
        <h2>Notifications</h2>
        <div class="crumbs">Dashboard › Notifications</div>
      </div>
      <div class="head-spacer"></div>
      <button type="button" class="btn-mark" id="markAll">Mark all as read</button>
    </div>

    <div class="layout">
      <!-- Left: live container temperature -->
      <aside class="temp-card">
        <div class="temp-top"><span>❄️</span> Container Temperature</div>
        <div class="temp-val" id="liveNoteTemp">-2.0°C</div>
        <div class="temp-note">Cold-chain is optimal • Peltier Active</div>
      </aside>

      <!-- Right: notification list -->
      <section class="list" id="noteList"></section>
    </div>
  </main>

<script>
  const notes = [
    { id: 1, icon: '📋', title: 'New Collection Assigned!', text: 'Priya Venkatesh (100ft Road, Vadapalani) - CBC + Thyroid Profile.', time: '10 minutes ago', tag: 'Home Pickup', unread: true },
    { id: 2, icon: '❄️', title: 'Real-Time Cold-Chain Telemetry', text: 'Peltier container cooling active at -2.0°C. 0 thermal excursions logged.', time: '20 minutes ago', tag: 'IoT Stream', unread: false, temp: true },
    { id: 3, icon: '🏷️', title: 'MedPlus LIMS Batch Handover', text: 'Manifest RAM1001 verified (4 sample vials securely received at Central Processing Lab).', time: '1 hour ago', tag: 'LIMS Verified', unread: false },
    { id: 4, icon: '🛡️', title: 'Security Audit Checkpoint', text: 'All field collections sealed with SHA-256 cryptographic signatures.', time: '2 hours ago', tag: 'Ledger Audit', unread: false }
  ];

  const listEl = document.getElementById('noteList');
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  function render() {
    if (!notes.length) { listEl.innerHTML = '<div class="empty">No notifications yet.</div>'; return; }
    listEl.innerHTML = notes.map(n => `
      <article class="note-card ${n.unread ? '' : 'read'}" data-id="${n.id}">
        <div class="note-ico ${n.temp ? 'temp' : ''}">${n.icon}</div>
        <div class="note-body">
          <div class="note-title">${esc(n.title)}</div>
          <div class="note-text">${esc(n.text)}</div>
          <div class="note-time ${n.unread ? 'new' : ''}">${esc(n.time)}${n.tag ? ' • ' + esc(n.tag) : ''}</div>
        </div>
        <div class="dot-new" title="Unread"></div>
      </article>`).join('');
    document.getElementById('bellDot').style.display = notes.some(n => n.unread) ? 'block' : 'none';
  }

  listEl.addEventListener('click', e => {
    const card = e.target.closest('.note-card');
    if (!card) return;
    const n = notes.find(x => String(x.id) === card.dataset.id);
    if (n) { n.unread = false; render(); }
  });

  document.getElementById('markAll').addEventListener('click', () => { notes.forEach(n => n.unread = false); render(); });

  async function syncNotificationTemp() {
    try {
      const resp = await fetch('/api/telemetry/current');
      if (resp.ok) {
        const d = await resp.json();
        if (d.success && typeof d.temperature === 'number') {
          document.getElementById('liveNoteTemp').innerText = `${d.temperature}°C`;
        }
      }
    } catch(e) {}
  }

  document.addEventListener('DOMContentLoaded', () => {
    try {
      const stored = localStorage.getItem('medreach_user');
      if (stored) {
        const u = JSON.parse(stored);
        if (u.name) document.getElementById('navUserName').innerText = u.name;
        if (u.role || u.employeeId) document.getElementById('navUserRole').innerText = `${u.employeeId || 'EMP-9342'} • ${u.role || 'Field Lead'}`;
        if (u.name) {
          const parts = u.name.split(' ');
          const initials = parts.length > 1 ? (parts[0][0] + parts[1][0]).toUpperCase() : parts[0].substring(0, 2).toUpperCase();
          document.getElementById('navAvatar').innerText = initials;
        }
      }
    } catch(e) {}

    render();
    syncNotificationTemp();
    setInterval(syncNotificationTemp, 3500);
  });
</script>
</body>
</html>
