<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reject / Reassign - MedReach</title>
  <link rel="icon" href="/static/images/favicon.svg" type="image/svg+xml">
  <style>
    :root { --primary: #149B9E; --surface: #FFFFFF; --surface-border: #E2E8F0; --text-dark: #0F172A; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    html, body { width: 100%; height: 100%; background: #0B192C; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    .phone-canvas { width: 100%; max-width: 412px; height: 100%; max-height: 860px; background: var(--surface); border-radius: 36px; box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    @media (max-width: 480px) { .phone-canvas { max-width: 100%; max-height: 100%; border-radius: 0; box-shadow: none; } }
    .phone-status-bar { height: 38px; padding: 8px 20px 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--text-dark); flex-shrink: 0; }
    .subscreen-header { height: 54px; padding: 0 16px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--surface-border); flex-shrink: 0; }
    .back-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: transparent; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text-dark); text-decoration: none; }
    .btn-reject-confirm { width: 100%; height: 50px; border-radius: 25px; background: #EF4444; color: #FFFFFF; font-size: 15.5px; font-weight: 700; border: none; cursor: pointer; margin-top: 30px; }
  </style>
</head>
<body>
  <div class="phone-canvas">
    <div class="phone-status-bar">
      <span>09:41</span>
      <div style="display: flex; gap: 6px; font-size: 11px;"><span>5G</span><span>📶</span><span>🔋 100%</span></div>
    </div>
    <div class="subscreen-header">
      <a href="/home" class="back-btn">←</a>
      <div style="font-size: 17px; font-weight: 800; color: var(--text-dark);">Reject / Reassign Task</div>
    </div>
    <div style="padding: 16px; flex: 1; overflow-y: auto;">
      <div style="font-size: 14px; font-weight: 700; color: var(--text-dark); margin-bottom: 14px;">Select Reason for Rejection:</div>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <label style="display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--text-dark); cursor: pointer;">
          <input type="radio" name="reason" value="Patient not available at home" checked style="accent-color: var(--primary);">
          Patient not available at home
        </label>
        <label style="display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--text-dark); cursor: pointer;">
          <input type="radio" name="reason" value="Patient refused sample collection" style="accent-color: var(--primary);">
          Patient refused sample collection
        </label>
        <label style="display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--text-dark); cursor: pointer;">
          <input type="radio" name="reason" value="Wrong address / phone unreachable" style="accent-color: var(--primary);">
          Wrong address / phone unreachable
        </label>
        <label style="display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--text-dark); cursor: pointer;">
          <input type="radio" name="reason" value="Fasting requirement not met by patient" style="accent-color: var(--primary);">
          Fasting requirement not met by patient
        </label>
        <label style="display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--text-dark); cursor: pointer;">
          <input type="radio" name="reason" value="Sample collection postponed by patient" style="accent-color: var(--primary);">
          Sample collection postponed by patient
        </label>
      </div>

      <button class="btn-reject-confirm" onclick="alert('Task Rejected and removed from queue!'); window.location.href='/home';">
        Confirm Rejection
      </button>
    </div>
  </div>
</body>
</html>
