<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optical Barcode Scanner - MedReach</title>
  <link rel="icon" href="/static/images/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --primary: #0D9488;
      --primary-dark: #0F766E;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    html, body { width: 100%; height: 100%; background: #000000; overflow: hidden; display: flex; flex-direction: column; }
    .scanner-top-bar {
      height: 60px;
      padding: 0 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #FFFFFF;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 20;
    }

    .btn-close-scanner {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #FFFFFF;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
    }

    /* Video Frame */
    .scanner-canvas-area {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .webcam-stream {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .overlay-vignette {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.38);
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 20px;
    }
    .google-lens-reticle {
      width: 320px;
      height: 220px;
      position: relative;
      margin-top: 40px;
    }

    .bracket {
      position: absolute;
      width: 42px;
      height: 42px;
      border-color: #FFFFFF;
      border-style: solid;
    }

    .tl { top: 0; left: 0; border-width: 5px 0 0 5px; border-top-left-radius: 16px; }
    .tr { top: 0; right: 0; border-width: 5px 5px 0 0; border-top-right-radius: 16px; }
    .bl { bottom: 0; left: 0; border-width: 0 0 5px 5px; border-bottom-left-radius: 16px; }
    .br { bottom: 0; right: 0; border-width: 0 5px 5px 0; border-bottom-right-radius: 16px; }

    .laser-beam-red {
      position: absolute;
      left: 14px;
      right: 14px;
      height: 3px;
      background: #EF4444;
      box-shadow: 0 0 12px #EF4444;
      border-radius: 2px;
      animation: laserSweepWidescreen 2.2s infinite ease-in-out;
    }

    @keyframes laserSweepWidescreen {
      0% { top: 14px; }
      50% { top: 200px; }
      100% { top: 14px; }
    }

    .floating-code-tag {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 18px;
      padding: 14px 28px;
      text-align: center;
      color: #FFFFFF;
    }

    .scanner-controls-footer {
      width: 100%;
      max-width: 480px;
      background: #FFFFFF;
      border-radius: 30px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .btn-associate-code {
      flex: 1;
      height: 52px;
      border-radius: 26px;
      background: #0D9488;
      color: #FFFFFF;
      font-size: 15.5px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-associate-code:disabled {
      background: #64748B;
      cursor: not-allowed;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Header -->
  <div class="scanner-top-bar">
    <div style="font-size: 16px; font-weight: 700;">
      📷 Optical Barcode Scanner (WebRTC Lens)
    </div>
    <a href="{{ return_url or '/home' }}" class="btn-close-scanner">✕</a>
  </div>

  <div class="scanner-canvas-area">
    <!-- Camera Video -->
    <video id="webcamVideo" class="webcam-stream" autoplay playsinline muted></video>

    <div class="overlay-vignette">
      <!-- Reticle Box with Corner Brackets & Laser -->
      <div class="google-lens-reticle">
        <div class="bracket tl"></div>
        <div class="bracket tr"></div>
        <div class="bracket bl"></div>
        <div class="bracket br"></div>
        <div class="laser-beam-red"></div>
      </div>

      <!-- Floating Code Tag -->
      <div class="floating-code-tag">
        <div style="font-size: 11px; letter-spacing: 1.2px; font-weight: 700; color: #94A3B8; margin-bottom: 4px;">BARCODE NUMBER</div>
        <div id="scannedCodeText" style="font-size: 19px; font-weight: 800; color: #FFFFFF;">Align barcode in viewfinder...</div>
      </div>

      <div style="margin-bottom: 10px;">
        <button type="button" onclick="simulateBarcodeScan()" style="background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.4); color: white; padding: 8px 18px; border-radius: 20px; font-size: 12.5px; cursor: pointer;">
          ⚡ Simulate Barcode Scan (Desktop Test)
        </button>
      </div>

      <!-- Footer Bar -->
      <div class="scanner-controls-footer">
        <button type="button" id="btnConfirmBarcode" class="btn-associate-code" disabled onclick="confirmScannedBarcode()">
          <span>🏷️</span> Fetch Reference No
        </button>
        <a href="{{ return_url or '/home' }}" style="font-size: 14px; font-weight: 700; color: #64748B; text-decoration: none;">Cancel</a>
      </div>
    </div>
  </div>

  <script>
    let detectedBarcode = '';
    const target = "{{ target or 'center' }}";

    
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      }).then(stream => {
        document.getElementById('webcamVideo').srcObject = stream;
      }).catch(_ => {});
    }

    function simulateBarcodeScan() {
      detectedBarcode = '39' + Math.floor(10000000000000000 + Math.random() * 90000000000000000);
      document.getElementById('scannedCodeText').textContent = detectedBarcode;
      const btn = document.getElementById('btnConfirmBarcode');
      btn.disabled = false;
      btn.textContent = target === 'patient' ? 'Associate Reference' : 'Fetch Reference No';
    }

    function confirmScannedBarcode() {
      if (!detectedBarcode) return;
      if (target === 'patient') {
        window.location.href = `/patient-detail?barcode=${detectedBarcode}`;
      } else {
        window.location.href = `/center-collection?ref=${detectedBarcode}`;
      }
    }
  </script>

</body>
</html>
